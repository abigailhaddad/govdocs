name: collect

# Collect new documents and mirror them to Hugging Face.
#
# Secrets this needs:
#   CF_R2_ACCOUNT_ID, CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY, CF_R2_BUCKET
#   SAM_API_KEY        api.data.gov key for the SAM Opportunities API
#   DATAGOV_API_KEY    api.data.gov key, used to read the FOIA component directory
#   HF_TOKEN           write token for the datasets

# Collection moved to the box (see deploy/). Both sources run there, in one
# place, because two collectors writing one collection is what left the foia
# dataset holding 9,797 files with a manifest listing 1,504 of them -- and SAM
# on a 120-call budget never reached five of its nine notice types anyway.
#
# Left dispatchable rather than deleted: it is the fallback if the box is gone.
on:
  # schedule:
    # (Was daily at 06:17 UTC, which consistently fired around 11:17.)
  #   - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to Hugging Face after collecting"
        type: boolean
        default: true

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # No playwright or chromium: those exist for the reading-room crawl,
        # which now runs on the box. SAM is a plain API and attachment fetch.
        run: pip install --quiet boto3 requests huggingface_hub pymupdf pyarrow

      - name: Restore collection state
        # seen.jsonl is what stops every run re-fetching the whole archive. It
        # is small, and caching it is enough: R2 holds the documents, so a cache
        # miss costs bandwidth rather than data.
        #
        # Restore and save are separate steps on purpose. actions/cache saves in
        # a post-job hook that is skipped when the job is cancelled, and this
        # job was cancelled by its own timeout on 2026-09-08 and 09: each run
        # crawled for five and a half hours and then threw away everything it
        # had learned, so the next day restored the same 09-07 state and redid
        # the same work. One cache existed for three days of running.
        uses: actions/cache/restore@v4
        with:
          path: |
            data/seen.jsonl
            data/published.jsonl
            data/reading_rooms.json
          key: govdocs-state-${{ github.run_id }}
          restore-keys: govdocs-state-

      - name: Check the runner can reach the gated sites
        # GitHub runs on datacenter addresses and some agencies treat those
        # differently from a home connection. This was verified from a
        # residential IP; if a site refuses the runner, this step says so
        # plainly instead of the crawl quietly returning nothing.
        run: |
          for u in https://www.justice.gov/olc/opinions \
                   https://api.foia.gov/api/agency_components?api_key=DEMO_KEY \
                   https://www.oversight.gov/api/v2/reports; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$u" || echo 000)
            echo "$code  $u"
          done

      # SAM is the only source this job collects now.
      #
      # The reading rooms moved to a Hetzner box (see deploy/): the crawl does
      # not fit in a GitHub job, and its step was cut at the timeout mid-crawl
      # every day. Two collectors writing one collection is the hazard that
      # left the manifest listing 1,504 of 9,797 files, so it runs in exactly
      # one place. The IG and DocumentCloud sources are retired -- sam and foia
      # are the two corpora being kept.
      - name: Collect from SAM
        continue-on-error: true
        # Measured at 23 minutes for 4,000 documents; 35 is headroom, not a
        # guess. The slack it used to hold was slack the reading rooms needed.
        timeout-minutes: 35
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python -m govdocs.collect --source sam --since 2025-01-20 --limit 4000 --max-calls 120

      # Collection pushes as it goes, one commit per batch. This step only
      # matters when documents are held in R2 and pushed separately.
      - name: Publish from R2
        if: ${{ false }}
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m govdocs.collect --publish sam
          python -m govdocs.collect --publish foia

      - name: Save collection state
        # if: always() so a cancelled or failed run still keeps what it learned.
        # This is the step whose absence cost two full days of crawling.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/seen.jsonl
            data/published.jsonl
            data/reading_rooms.json
          key: govdocs-state-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, collections, pathlib
          p = pathlib.Path("data/seen.jsonl")
          rows = [json.loads(l) for l in p.read_text().splitlines()] if p.exists() else []
          ok = [r for r in rows if r.get("doc_id")]
          by = collections.Counter(r.get("source") for r in ok)
          gb = sum(r.get("bytes", 0) for r in ok) / 1e9
          print(f"## Collected\n\n{len(ok)} documents, {gb:.2f} GB\n")
          for k, v in by.most_common():
              print(f"- {k}: {v}")
          PY
